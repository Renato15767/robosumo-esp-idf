[platformio]
default_envs = autonomo
src_dir = main

[env:autonomo]
platform = espressif32@6.12.0
board = esp32dev
framework = espidf
monitor_speed = 115200
upload_speed = 115200

[env:diagnostico]
extends = env:autonomo
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.diagnostico.defaults"
